version: '3.8'

services:
  # 1. PostgreSQL Database
  db:
    image: postgres:15
    container_name: ridery_db
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=${DB_USER}
    volumes:
      - odoo-db-data:/var/lib/postgresql/data
    networks:
      - ridery_net
    restart: unless-stopped

  # 2. Odoo ERP (Versión 16)
  odoo:
    image: odoo:16.0
    container_name: ridery_odoo
    depends_on:
      - db
    ports:
      - "8069:8069"
    volumes:
      - ./odoo/addons:/mnt/extra-addons
      - ./odoo/config/odoo.conf:/etc/odoo/odoo.conf
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=${DB_USER}
      - PASSWORD=${DB_PASSWORD}
    command: odoo -d ${DB_NAME} --without-demo=all
    networks:
      - ridery_net
    restart: unless-stopped

  # 3. Node API (Sincronización de Viajes)
  node_api:
    build:
      context: ./node_api
      dockerfile: Dockerfile
    container_name: ridery_node_api
    depends_on:
      - odoo
    ports:
      - "3000:3000"
    environment:
      - ODOO_BASE_URL=http://odoo:8069
      - ODOO_API_KEY=RIDERY-CHANGE-ME-IN-PRODUCTION
      - ODOO_ORIGIN=http://localhost:3000
    volumes:
      - ./node_api/src/data:/app/src/data
      - ridery-api-logs:/app/logs
    networks:
      - ridery_net
    restart: unless-stopped

volumes:
  odoo-db-data:
  odoo-web-data:
  ridery-api-logs:

networks:
  ridery_net:
    driver: bridge
